<!DOCTYPE html>

<body>
<h1>리플렉션 개념도 (그림 1-3 교체용) — 방향 2 보강</h1>
<p class="lead">안내원 장면(위) + "비유 → 실제" 매핑(아래). 장면이 코드로 착지하게.</p>

<div class="card">

<p class="desc">명단 박힌 안내원(적힌 사람만) vs 명단 없는 안내원(누가 오든 이름표 읽어 처리). 아래 band에서 각 요소가 코드로 무엇인지 회수.</p>

  <rect x="236" y="92" width="8" height="216" rx="3" fill="#cbd5e1"/>

  <text x="573" y="252" text-anchor="middle" font-size="9" fill="#64748b">처음 봐도 읽어서</text>
</svg>

<hr class="divider">
<p class="sub">이 장면을 코드로 옮기면</p>
<svg class="map" viewBox="0 0 560 200" xmlns="http://www.w3.org/2000/svg">

  <line x1="172" y1="77" x2="204" y2="77" stroke="#4f46e5" stroke-width="1.6" marker-end="url(#m-ar)"/>
  <rect x="210" y="60" width="334" height="34" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="377" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#3730a3">코드에 미리 박은 이름 (if문의 주소)</text>
  <rect x="16" y="104" width="150" height="34" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="91" y="126" text-anchor="middle" font-size="12" fill="#334155">손님 목에 건 이름표</text>
  <line x1="172" y1="121" x2="204" y2="121" stroke="#4f46e5" stroke-width="1.6" marker-end="url(#m-ar)"/>

  <text x="377" y="126" text-anchor="middle" font-size="12" font-weight="700" fill="#3730a3">메서드에 단 표식 (어노테이션)</text>
  <rect x="16" y="148" width="150" height="34" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="91" y="170" text-anchor="middle" font-size="12" fill="#334155">찾아오는 손님</text>
  <line x1="172" y1="165" x2="204" y2="165" stroke="#4f46e5" stroke-width="1.6" marker-end="url(#m-ar)"/>
  <rect x="210" y="148" width="334" height="34" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>

</svg>
<p class="note">명단 없는 안내원이 하는 일 = 스프링이 표식을 읽어, 미리 알지 못한 내 코드를 처리하는 일</p>

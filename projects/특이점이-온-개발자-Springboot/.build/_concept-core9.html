<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>리플렉션 개념도 — 사람 세로중앙 + 여백정리</title>
<style>
  body { font-family: "Pretendard","Malgun Gothic",system-ui,sans-serif; color:#0f172a; background:#f1f5f9; margin:0; padding:40px; }
  h1 { font-size:22px; margin:0 0 6px; }
  p.lead { color:#475569; margin:0 0 30px; }
  .card { background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:24px 28px; margin:0 0 28px; }
  .card .note { text-align:center; color:#334155; font-size:13px; margin-top:10px; font-style:italic; }
  svg { display:block; width:100%; height:auto; max-width:780px; margin:0 auto; }
</style>
</head>
<body>
<h1>리플렉션 개념도 (그림 1-3 교체용) — 사람 세로 중앙 + 여백 정리</h1>
<p class="lead">사람을 두 요청의 세로 중앙으로. 패널 높이를 내용에 맞춰 바닥 여백 제거. 좌우 대칭 유지.</p>

<div class="card">
<svg viewBox="0 0 760 274" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="c9-g" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#16a34a"/></marker>
    <marker id="c9-o" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#c2410c"/></marker>
  </defs>

  <rect x="20" y="46" width="346" height="228" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="193" y="74" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">if 문</text>
  <text x="193" y="92" text-anchor="middle" font-size="10.5" fill="#64748b">적어둔 이름만 실행한다</text>
  <circle cx="70" cy="176" r="15" fill="#fff" stroke="#475569" stroke-width="1.6"/>
  <rect x="52" y="194" width="36" height="26" rx="10" fill="#fff" stroke="#475569" stroke-width="1.6"/>
  <rect x="98" y="158" width="58" height="64" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.4"/>
  <text x="127" y="176" text-anchor="middle" font-size="9" font-weight="700" fill="#475569">아는 이름</text>
  <text x="110" y="193" font-size="9.5" fill="#334155">insert</text>
  <text x="110" y="206" font-size="9.5" fill="#334155">delete</text>
  <text x="110" y="219" font-size="9.5" fill="#334155">update</text>
  <rect x="250" y="132" width="94" height="28" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="297" y="150" text-anchor="middle" font-size="11.5" fill="#3730a3">/insert</text>
  <line x1="248" y1="146" x2="166" y2="146" stroke="#16a34a" stroke-width="1.8" marker-end="url(#c9-g)"/>
  <text x="207" y="138" text-anchor="middle" font-size="11" font-weight="700" fill="#16a34a">실행</text>
  <rect x="250" y="220" width="94" height="28" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="297" y="238" text-anchor="middle" font-size="11.5" fill="#64748b">/select</text>
  <line x1="248" y1="234" x2="166" y2="234" stroke="#c2410c" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#c9-o)"/>
  <text x="205" y="226" text-anchor="middle" font-size="11" font-weight="700" fill="#c2410c">실행 안 됨</text>
  <text x="205" y="258" text-anchor="middle" font-size="9" fill="#94a3b8">목록에 없음</text>

  <rect x="394" y="46" width="346" height="228" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="567" y="74" text-anchor="middle" font-size="14" font-weight="800" fill="#3730a3">리플렉션</text>
  <text x="567" y="92" text-anchor="middle" font-size="10.5" fill="#64748b">붙은 @표식을 읽어 실행한다</text>
  <circle cx="444" cy="176" r="15" fill="#fff" stroke="#4f46e5" stroke-width="1.7"/>
  <rect x="426" y="194" width="36" height="26" rx="10" fill="#fff" stroke="#4f46e5" stroke-width="1.7"/>
  <rect x="472" y="158" width="58" height="64" rx="6" fill="#f8fafc" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="501" y="192" text-anchor="middle" font-size="22" font-weight="800" fill="#3730a3">@</text>
  <text x="501" y="212" text-anchor="middle" font-size="9" fill="#475569">표식 읽기</text>
  <rect x="624" y="132" width="94" height="28" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <rect x="630" y="137" width="16" height="18" rx="4" fill="#4f46e5"/>
  <text x="638" y="151" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">@</text>
  <text x="684" y="150" text-anchor="middle" font-size="11.5" fill="#3730a3">/insert</text>
  <line x1="622" y1="146" x2="540" y2="146" stroke="#16a34a" stroke-width="1.8" marker-end="url(#c9-g)"/>
  <text x="581" y="138" text-anchor="middle" font-size="11" font-weight="700" fill="#16a34a">실행</text>
  <rect x="624" y="220" width="94" height="28" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <rect x="630" y="225" width="16" height="18" rx="4" fill="#4f46e5"/>
  <text x="638" y="239" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">@</text>
  <text x="684" y="238" text-anchor="middle" font-size="11.5" fill="#3730a3">/select</text>
  <line x1="622" y1="234" x2="540" y2="234" stroke="#16a34a" stroke-width="1.8" marker-end="url(#c9-g)"/>
  <text x="581" y="226" text-anchor="middle" font-size="11" font-weight="700" fill="#16a34a">실행</text>
  <text x="581" y="258" text-anchor="middle" font-size="9" fill="#64748b">처음 봐도 표식 읽음</text>
</svg>
<p class="note">if문은 적어둔 이름만 실행하지만, 리플렉션은 @표식을 읽어 처음 보는 메서드도 실행합니다</p>
</div>

</body>
</html>

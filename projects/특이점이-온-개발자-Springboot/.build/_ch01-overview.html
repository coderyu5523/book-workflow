<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>그림 1-1 후보 — 자동화 램프</title>
<style>
  body { font-family: "Pretendard","Malgun Gothic",system-ui,sans-serif; color:#0f172a; background:#f1f5f9; margin:0; padding:40px; }
  h1 { font-size:20px; margin:0 0 6px; }
  p.lead { color:#475569; margin:0 0 24px; font-size:14px; }
  .card { background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:24px 28px; }
  .card .note { text-align:center; color:#334155; font-size:13px; margin-top:10px; font-style:italic; }
  svg { display:block; width:100%; height:auto; max-width:820px; margin:0 auto; }
</style>
</head>
<body>
<h1>그림 1-1 후보 — 수작업 → 자동화 3단계</h1>
<p class="lead">박스 나열 대신, 올라가는 램프 위에 단계별 아이콘. 오를수록 개발자 손이 빠지고 스프링이 대신한다.</p>

<div class="card">
<svg viewBox="0 0 820 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="스프링 원리를 만드는 세 단계. if-else 직접 연결에서 리플렉션 표식, 컴포넌트 스캔 자동 생성으로 오를수록 개발자 수작업이 줄고 스프링 자동화가 는다.">
  <defs>
    <marker id="ov-ar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#4f46e5"/></marker>
  </defs>
  <line x1="64" y1="260" x2="756" y2="100" stroke="#e0e7ff" stroke-width="16" stroke-linecap="round"/>
  <line x1="120" y1="244" x2="742" y2="102" stroke="#4f46e5" stroke-width="2" stroke-dasharray="2 7" marker-end="url(#ov-ar)"/>
  <text x="86" y="284" text-anchor="middle" font-size="11" font-weight="700" fill="#64748b">개발자 수작업</text>
  <text x="726" y="86" text-anchor="middle" font-size="11" font-weight="700" fill="#3730a3">스프링 자동화</text>

  <!-- 1단계: if-else 직접 연결 (개발자가 일일이) -->
  <circle cx="132" cy="196" r="11" fill="#fff" stroke="#475569" stroke-width="1.6"/>
  <rect x="122" y="208" width="20" height="16" rx="6" fill="#fff" stroke="#475569" stroke-width="1.6"/>
  <circle cx="190" cy="190" r="4.5" fill="#fff" stroke="#475569" stroke-width="1.3"/>
  <circle cx="190" cy="205" r="4.5" fill="#fff" stroke="#475569" stroke-width="1.3"/>
  <circle cx="190" cy="220" r="4.5" fill="#fff" stroke="#475569" stroke-width="1.3"/>
  <line x1="148" y1="206" x2="185" y2="190" stroke="#94a3b8" stroke-width="1.3"/>
  <line x1="148" y1="210" x2="185" y2="205" stroke="#94a3b8" stroke-width="1.3"/>
  <line x1="148" y1="214" x2="185" y2="220" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="150" y="250" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">① if-else</text>
  <text x="150" y="266" text-anchor="middle" font-size="10" fill="#64748b">주소마다 직접 연결</text>

  <!-- 2단계: 리플렉션 표식 -->
  <rect x="392" y="128" width="28" height="24" rx="5" fill="#4f46e5"/>
  <text x="406" y="145" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">@</text>
  <circle cx="444" cy="140" r="11" fill="#fff" stroke="#4f46e5" stroke-width="1.6"/>
  <line x1="452" y1="148" x2="461" y2="157" stroke="#4f46e5" stroke-width="2"/>
  <text x="420" y="184" text-anchor="middle" font-size="12" font-weight="800" fill="#3730a3">② 리플렉션</text>
  <text x="420" y="200" text-anchor="middle" font-size="10" fill="#64748b">표식만 달면 자동 호출</text>

  <!-- 3단계: 컴포넌트 스캔 자동 -->
  <rect x="636" y="72" width="16" height="8" rx="2" fill="#fff" stroke="#475569" stroke-width="1.3"/>
  <rect x="636" y="79" width="40" height="28" rx="3" fill="#fff" stroke="#475569" stroke-width="1.5"/>
  <circle cx="702" cy="92" r="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <rect x="699" y="76" width="6" height="8" rx="1.5" fill="#4f46e5"/>
  <rect x="699" y="100" width="6" height="8" rx="1.5" fill="#4f46e5"/>
  <rect x="686" y="89" width="8" height="6" rx="1.5" fill="#4f46e5"/>
  <rect x="710" y="89" width="8" height="6" rx="1.5" fill="#4f46e5"/>
  <text x="678" y="130" text-anchor="middle" font-size="12" font-weight="800" fill="#3730a3">③ 컴포넌트 스캔</text>
  <text x="678" y="146" text-anchor="middle" font-size="10" fill="#64748b">객체까지 자동 생성</text>
</svg>
<p class="note">직접 연결에서 표식으로, 다시 자동 생성으로 올라갈수록 개발자의 손이 빠지고 스프링이 대신합니다</p>
</div>

</body>
</html>

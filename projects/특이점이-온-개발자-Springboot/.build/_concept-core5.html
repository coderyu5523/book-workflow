<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>리플렉션 개념도 — 회색 벽 제거</title>
<style>
  body { font-family: "Pretendard","Malgun Gothic",system-ui,sans-serif; color:#0f172a; background:#f1f5f9; margin:0; padding:40px; }
  h1 { font-size:22px; margin:0 0 6px; }
  p.lead { color:#475569; margin:0 0 30px; }
  .card { background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:24px 28px; margin:0 0 28px; }
  .card .note { text-align:center; color:#334155; font-size:13px; margin-top:10px; font-style:italic; }
  svg { display:block; width:100%; height:auto; max-width:780px; margin:0 auto; }
</style>
</head>
<body>
<h1>리플렉션 개념도 (그림 1-3 교체용) — 회색 벽 제거</h1>
<p class="lead">의미 없던 회색 벽 삭제. 요청이 처리자에게 곧장 가고, 결과만 부름/못 부름으로. 왼쪽은 목록 대조, 오른쪽은 표식 읽기.</p>

<div class="card">
<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="c5-g" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#16a34a"/></marker>
    <marker id="c5-o" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#c2410c"/></marker>
  </defs>

  <rect x="20" y="46" width="346" height="280" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="193" y="72" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">if 문</text>
  <text x="193" y="90" text-anchor="middle" font-size="10.5" fill="#64748b">미리 적어둔 이름만 부른다</text>
  <circle cx="70" cy="140" r="15" fill="#fff" stroke="#475569" stroke-width="1.6"/>
  <rect x="52" y="158" width="36" height="30" rx="10" fill="#fff" stroke="#475569" stroke-width="1.6"/>
  <rect x="98" y="132" width="54" height="66" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.4"/>
  <text x="125" y="148" text-anchor="middle" font-size="9" font-weight="700" fill="#475569">아는 이름</text>
  <text x="106" y="164" font-size="9.5" fill="#334155">insert</text>
  <text x="106" y="178" font-size="9.5" fill="#334155">delete</text>
  <text x="106" y="192" font-size="9.5" fill="#334155">update</text>
  <rect x="252" y="126" width="92" height="28" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="298" y="144" text-anchor="middle" font-size="11.5" fill="#3730a3">/insert</text>
  <line x1="250" y1="140" x2="166" y2="140" stroke="#16a34a" stroke-width="1.8" marker-end="url(#c5-g)"/>
  <text x="208" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#16a34a">부름</text>
  <rect x="252" y="224" width="92" height="28" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="298" y="242" text-anchor="middle" font-size="11.5" fill="#64748b">/select</text>
  <line x1="250" y1="238" x2="166" y2="238" stroke="#c2410c" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#c5-o)"/>
  <text x="204" y="226" text-anchor="middle" font-size="11" font-weight="700" fill="#c2410c">못 부름</text>
  <text x="204" y="262" text-anchor="middle" font-size="9" fill="#94a3b8">목록에 없음</text>

  <rect x="394" y="46" width="346" height="280" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="567" y="72" text-anchor="middle" font-size="14" font-weight="800" fill="#3730a3">리플렉션</text>
  <text x="567" y="90" text-anchor="middle" font-size="10.5" fill="#64748b">붙은 표식을 읽어 부른다</text>
  <circle cx="446" cy="140" r="15" fill="#fff" stroke="#4f46e5" stroke-width="1.7"/>
  <rect x="428" y="158" width="36" height="30" rx="10" fill="#fff" stroke="#4f46e5" stroke-width="1.7"/>
  <circle cx="490" cy="152" r="13" fill="#fff" stroke="#4f46e5" stroke-width="1.6"/>
  <line x1="499" y1="161" x2="510" y2="172" stroke="#4f46e5" stroke-width="2"/>
  <text x="468" y="200" text-anchor="middle" font-size="9.5" fill="#64748b">표식을 읽는다</text>
  <rect x="626" y="126" width="92" height="28" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <rect x="618" y="132" width="9" height="16" rx="2" fill="#4f46e5"/>
  <text x="674" y="144" text-anchor="middle" font-size="11.5" fill="#3730a3">/insert</text>
  <line x1="624" y1="140" x2="540" y2="140" stroke="#16a34a" stroke-width="1.8" marker-end="url(#c5-g)"/>
  <text x="582" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#16a34a">부름</text>
  <rect x="626" y="224" width="92" height="28" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <rect x="618" y="230" width="9" height="16" rx="2" fill="#4f46e5"/>
  <text x="674" y="242" text-anchor="middle" font-size="11.5" fill="#3730a3">/select</text>
  <line x1="624" y1="238" x2="540" y2="238" stroke="#16a34a" stroke-width="1.8" marker-end="url(#c5-g)"/>
  <text x="582" y="226" text-anchor="middle" font-size="11" font-weight="700" fill="#16a34a">부름</text>
  <text x="582" y="262" text-anchor="middle" font-size="9" fill="#64748b">처음 봐도 표식 읽음</text>
  <rect x="452" y="298" width="10" height="14" rx="2" fill="#4f46e5"/>
  <text x="500" y="309" text-anchor="middle" font-size="9.5" fill="#64748b">= 표식</text>
</svg>
<p class="note">if문은 적어둔 이름만 부르지만, 리플렉션은 표식을 읽어 처음 보는 메서드도 부릅니다</p>
</div>

</body>
</html>

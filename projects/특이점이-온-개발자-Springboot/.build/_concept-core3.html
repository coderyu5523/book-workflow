<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>리플렉션 개념도 — 비유 제거</title>
<style>
  body { font-family: "Pretendard","Malgun Gothic",system-ui,sans-serif; color:#0f172a; background:#f1f5f9; margin:0; padding:40px; }
  h1 { font-size:22px; margin:0 0 6px; }
  p.lead { color:#475569; margin:0 0 30px; }
  .card { background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:24px 28px; margin:0 0 28px; }
  .card .note { text-align:center; color:#334155; font-size:13px; margin-top:10px; font-style:italic; }
  svg { display:block; width:100%; height:auto; max-width:780px; margin:0 auto; }
</style>
</head>
<body>
<h1>리플렉션 개념도 (그림 1-3 교체용) — 비유 라벨·매핑표 제거</h1>
<p class="lead">안내원·손님 같은 비유 단어와 긴 설명을 빼고, 리플렉션을 그림에 직접. 핵심(처음 보는 /select도 부른다)을 그림으로만.</p>

<div class="card">
<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="c3-g" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#16a34a"/></marker>
    <marker id="c3-o" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#c2410c"/></marker>
  </defs>

  <rect x="20" y="44" width="346" height="240" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="193" y="70" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">if 문</text>
  <text x="193" y="88" text-anchor="middle" font-size="11" fill="#64748b">미리 적어둔 이름만 부른다</text>
  <rect x="40" y="112" width="96" height="104" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.4"/>
  <text x="88" y="132" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">아는 이름</text>
  <text x="56" y="152" font-size="10.5" fill="#334155">insert</text>
  <text x="56" y="170" font-size="10.5" fill="#334155">delete</text>
  <text x="56" y="188" font-size="10.5" fill="#334155">update</text>
  <rect x="250" y="118" width="90" height="28" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="295" y="136" text-anchor="middle" font-size="11.5" fill="#3730a3">/insert</text>
  <line x1="248" y1="132" x2="150" y2="132" stroke="#16a34a" stroke-width="1.8" marker-end="url(#c3-g)"/>
  <text x="192" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#16a34a">부름</text>
  <rect x="250" y="200" width="90" height="28" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="295" y="218" text-anchor="middle" font-size="11.5" fill="#64748b">/select</text>
  <line x1="248" y1="214" x2="196" y2="214" stroke="#c2410c" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#c3-o)"/>
  <text x="188" y="196" text-anchor="middle" font-size="11" font-weight="700" fill="#c2410c">못 부름</text>
  <text x="188" y="232" text-anchor="middle" font-size="9.5" fill="#94a3b8">목록에 없음</text>

  <rect x="394" y="44" width="346" height="240" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="567" y="70" text-anchor="middle" font-size="15" font-weight="800" fill="#3730a3">리플렉션</text>
  <text x="567" y="88" text-anchor="middle" font-size="11" fill="#64748b">붙은 표식을 읽어 부른다</text>
  <rect x="414" y="112" width="96" height="104" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.7"/>
  <text x="462" y="156" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3730a3">표식을</text>
  <text x="462" y="174" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3730a3">읽는다</text>
  <rect x="624" y="118" width="90" height="28" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <rect x="616" y="124" width="9" height="16" rx="2" fill="#4f46e5"/>
  <text x="672" y="136" text-anchor="middle" font-size="11.5" fill="#3730a3">/insert</text>
  <line x1="622" y1="132" x2="514" y2="132" stroke="#16a34a" stroke-width="1.8" marker-end="url(#c3-g)"/>
  <text x="566" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#16a34a">부름</text>
  <rect x="624" y="200" width="90" height="28" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <rect x="616" y="206" width="9" height="16" rx="2" fill="#4f46e5"/>
  <text x="672" y="218" text-anchor="middle" font-size="11.5" fill="#3730a3">/select</text>
  <line x1="622" y1="214" x2="514" y2="214" stroke="#16a34a" stroke-width="1.8" marker-end="url(#c3-g)"/>
  <text x="566" y="196" text-anchor="middle" font-size="11" font-weight="700" fill="#16a34a">부름</text>
  <text x="566" y="232" text-anchor="middle" font-size="9.5" fill="#64748b">처음 봐도 표식 읽어</text>
  <rect x="600" y="238" width="30" height="12" rx="2" fill="#4f46e5"/>
  <text x="648" y="248" text-anchor="middle" font-size="9.5" fill="#64748b">= 표식</text>
</svg>
<p class="note">if문은 미리 적어둔 이름만 부르지만, 리플렉션은 표식만 있으면 처음 보는 메서드도 부릅니다</p>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>리플렉션 개념도 — hub 재배치</title>
<style>
  body { font-family: "Pretendard","Malgun Gothic",system-ui,sans-serif; color:#0f172a; background:#f1f5f9; margin:0; padding:40px; }
  h1 { font-size:22px; margin:0 0 6px; }
  p.lead { color:#475569; margin:0 0 30px; }
  .card { background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:24px 28px; margin:0 0 28px; }
  .card .note { text-align:center; color:#334155; font-size:13px; margin-top:10px; font-style:italic; }
  svg { display:block; width:100%; height:auto; max-width:780px; margin:0 auto; }
</style>
</head>
<body>
<h1>리플렉션 개념도 (그림 1-3 교체용) — 요청 → 처리자 → 결과</h1>
<p class="lead">범례 삭제. 처리자를 가운데 hub로 두고 화살표가 정확히 연결. 결과는 실행 / 실행 안 됨.</p>

<div class="card">
<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="c7-n" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#94a3b8"/></marker>
    <marker id="c7-g" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#16a34a"/></marker>
    <marker id="c7-o" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#c2410c"/></marker>
  </defs>

  <rect x="20" y="46" width="346" height="250" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="193" y="74" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">if 문</text>
  <text x="193" y="92" text-anchor="middle" font-size="10.5" fill="#64748b">적어둔 이름만 실행한다</text>
  <rect x="40" y="118" width="80" height="28" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="80" y="136" text-anchor="middle" font-size="11.5" fill="#3730a3">/insert</text>
  <rect x="40" y="214" width="80" height="28" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="80" y="232" text-anchor="middle" font-size="11.5" fill="#64748b">/select</text>
  <circle cx="193" cy="138" r="15" fill="#fff" stroke="#475569" stroke-width="1.6"/>
  <rect x="175" y="156" width="36" height="26" rx="10" fill="#fff" stroke="#475569" stroke-width="1.6"/>
  <rect x="156" y="188" width="74" height="42" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.3"/>
  <text x="193" y="204" text-anchor="middle" font-size="8.5" font-weight="700" fill="#475569">아는 이름</text>
  <text x="193" y="220" text-anchor="middle" font-size="8" fill="#334155">insert·delete·update</text>
  <line x1="122" y1="132" x2="170" y2="140" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#c7-n)"/>
  <line x1="122" y1="228" x2="170" y2="176" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#c7-n)"/>
  <line x1="216" y1="140" x2="286" y2="132" stroke="#16a34a" stroke-width="1.8" marker-end="url(#c7-g)"/>
  <text x="316" y="136" text-anchor="middle" font-size="11" font-weight="700" fill="#16a34a">실행</text>
  <line x1="216" y1="176" x2="286" y2="228" stroke="#c2410c" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#c7-o)"/>
  <text x="320" y="232" text-anchor="middle" font-size="11" font-weight="700" fill="#c2410c">실행 안 됨</text>

  <rect x="394" y="46" width="346" height="250" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="567" y="74" text-anchor="middle" font-size="14" font-weight="800" fill="#3730a3">리플렉션</text>
  <text x="567" y="92" text-anchor="middle" font-size="10.5" fill="#64748b">붙은 @표식을 읽어 실행한다</text>
  <rect x="414" y="118" width="100" height="28" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <rect x="420" y="123" width="17" height="18" rx="4" fill="#4f46e5"/>
  <text x="428" y="137" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">@</text>
  <text x="478" y="136" text-anchor="middle" font-size="11.5" fill="#3730a3">/insert</text>
  <rect x="414" y="214" width="100" height="28" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <rect x="420" y="219" width="17" height="18" rx="4" fill="#4f46e5"/>
  <text x="428" y="233" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">@</text>
  <text x="478" y="232" text-anchor="middle" font-size="11.5" fill="#3730a3">/select</text>
  <circle cx="567" cy="138" r="15" fill="#fff" stroke="#4f46e5" stroke-width="1.7"/>
  <rect x="549" y="156" width="36" height="26" rx="10" fill="#fff" stroke="#4f46e5" stroke-width="1.7"/>
  <circle cx="598" cy="166" r="10" fill="#fff" stroke="#4f46e5" stroke-width="1.5"/>
  <line x1="606" y1="174" x2="615" y2="183" stroke="#4f46e5" stroke-width="1.9"/>
  <text x="567" y="212" text-anchor="middle" font-size="9" fill="#64748b">@표식 읽기</text>
  <line x1="516" y1="132" x2="544" y2="140" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#c7-n)"/>
  <line x1="516" y1="228" x2="544" y2="176" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#c7-n)"/>
  <line x1="590" y1="140" x2="648" y2="132" stroke="#16a34a" stroke-width="1.8" marker-end="url(#c7-g)"/>
  <text x="688" y="136" text-anchor="middle" font-size="11" font-weight="700" fill="#16a34a">실행</text>
  <line x1="590" y1="176" x2="648" y2="228" stroke="#16a34a" stroke-width="1.8" marker-end="url(#c7-g)"/>
  <text x="688" y="232" text-anchor="middle" font-size="11" font-weight="700" fill="#16a34a">실행</text>
</svg>
<p class="note">if문은 적어둔 이름만 실행하지만, 리플렉션은 @표식을 읽어 처음 보는 메서드도 실행합니다</p>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>리플렉션 개념도 — 원복 + 대칭</title>
<style>
  body { font-family: "Pretendard","Malgun Gothic",system-ui,sans-serif; color:#0f172a; background:#f1f5f9; margin:0; padding:40px; }
  h1 { font-size:22px; margin:0 0 6px; }
  p.lead { color:#475569; margin:0 0 30px; }
  .card { background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:24px 28px; margin:0 0 28px; }
  .card .note { text-align:center; color:#334155; font-size:13px; margin-top:10px; font-style:italic; }
  svg { display:block; width:100%; height:auto; max-width:780px; margin:0 auto; }
</style>
</head>
<body>
<h1>리플렉션 개념도 (그림 1-3 교체용) — 장면 원복 + 좌우 대칭</h1>
<p class="lead">원래 장면 그대로. 좌우 패널 요소를 같은 상대 위치로 맞추고, 범례 삭제, 실행/실행 안 됨.</p>

<div class="card">
<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="c8-g" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#16a34a"/></marker>
    <marker id="c8-o" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#c2410c"/></marker>
  </defs>

  <rect x="20" y="46" width="346" height="280" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="193" y="72" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">if 문</text>
  <text x="193" y="90" text-anchor="middle" font-size="10.5" fill="#64748b">적어둔 이름만 실행한다</text>
  <circle cx="70" cy="140" r="15" fill="#fff" stroke="#475569" stroke-width="1.6"/>
  <rect x="52" y="158" width="36" height="30" rx="10" fill="#fff" stroke="#475569" stroke-width="1.6"/>
  <rect x="98" y="132" width="56" height="66" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.4"/>
  <text x="126" y="150" text-anchor="middle" font-size="9" font-weight="700" fill="#475569">아는 이름</text>
  <text x="108" y="167" font-size="9.5" fill="#334155">insert</text>
  <text x="108" y="181" font-size="9.5" fill="#334155">delete</text>
  <text x="108" y="195" font-size="9.5" fill="#334155">update</text>
  <rect x="250" y="126" width="94" height="28" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="297" y="144" text-anchor="middle" font-size="11.5" fill="#3730a3">/insert</text>
  <line x1="248" y1="140" x2="166" y2="140" stroke="#16a34a" stroke-width="1.8" marker-end="url(#c8-g)"/>
  <text x="207" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#16a34a">실행</text>
  <rect x="250" y="224" width="94" height="28" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="297" y="242" text-anchor="middle" font-size="11.5" fill="#64748b">/select</text>
  <line x1="248" y1="238" x2="166" y2="238" stroke="#c2410c" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#c8-o)"/>
  <text x="205" y="226" text-anchor="middle" font-size="11" font-weight="700" fill="#c2410c">실행 안 됨</text>
  <text x="205" y="262" text-anchor="middle" font-size="9" fill="#94a3b8">목록에 없음</text>

  <rect x="394" y="46" width="346" height="280" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="567" y="72" text-anchor="middle" font-size="14" font-weight="800" fill="#3730a3">리플렉션</text>
  <text x="567" y="90" text-anchor="middle" font-size="10.5" fill="#64748b">붙은 @표식을 읽어 실행한다</text>
  <circle cx="444" cy="140" r="15" fill="#fff" stroke="#4f46e5" stroke-width="1.7"/>
  <rect x="426" y="158" width="36" height="30" rx="10" fill="#fff" stroke="#4f46e5" stroke-width="1.7"/>
  <rect x="472" y="132" width="56" height="66" rx="6" fill="#f8fafc" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="500" y="168" text-anchor="middle" font-size="22" font-weight="800" fill="#3730a3">@</text>
  <text x="500" y="188" text-anchor="middle" font-size="9" fill="#475569">표식 읽기</text>
  <rect x="624" y="126" width="94" height="28" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <rect x="630" y="131" width="16" height="18" rx="4" fill="#4f46e5"/>
  <text x="638" y="145" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">@</text>
  <text x="684" y="144" text-anchor="middle" font-size="11.5" fill="#3730a3">/insert</text>
  <line x1="622" y1="140" x2="540" y2="140" stroke="#16a34a" stroke-width="1.8" marker-end="url(#c8-g)"/>
  <text x="581" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#16a34a">실행</text>
  <rect x="624" y="224" width="94" height="28" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <rect x="630" y="229" width="16" height="18" rx="4" fill="#4f46e5"/>
  <text x="638" y="243" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">@</text>
  <text x="684" y="242" text-anchor="middle" font-size="11.5" fill="#3730a3">/select</text>
  <line x1="622" y1="238" x2="540" y2="238" stroke="#16a34a" stroke-width="1.8" marker-end="url(#c8-g)"/>
  <text x="581" y="226" text-anchor="middle" font-size="11" font-weight="700" fill="#16a34a">실행</text>
  <text x="581" y="262" text-anchor="middle" font-size="9" fill="#64748b">처음 봐도 표식 읽음</text>
</svg>
<p class="note">if문은 적어둔 이름만 실행하지만, 리플렉션은 @표식을 읽어 처음 보는 메서드도 실행합니다</p>
</div>

</body>
</html>
